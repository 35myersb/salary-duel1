<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Duel</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:20px calc(16px + (100vw - 320px)/8);position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:900;letter-spacing:1px}.tag{opacity:.72;font-size:13px;margin-top:3px}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #1118270b}h1,h2,h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}input,select,textarea,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #cbd5e1}input,select,textarea{width:100%;margin:5px 0 12px}button{background:#111827;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px;margin:2px}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.salary{font-size:22px;font-weight:900}.player{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:7px 0}.player small{display:block;color:#64748b}.player.selected{border-color:#111827;background:#f8fafc}.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.slot{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.slot h3{font-size:14px}.err{color:#b42318}.good{color:#087443}.muted{color:#64748b}.standings{width:100%;border-collapse:collapse}.standings th,.standings td{text-align:left;padding:8px;border-bottom:1px solid #e5e7eb}.matchup{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}.matchup summary{cursor:pointer;list-style:none}.matchup summary::-webkit-details-marker{display:none}.match-team{margin-top:12px;padding:10px;border-radius:10px;background:#f8fafc}.versus{text-align:center;font-weight:900;color:#64748b;margin:8px}.lineup-list{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}.live-score{font-size:30px;font-weight:900}.score-team{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}.score-player{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef2f5;font-size:13px}.tabbar{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabbar button{white-space:nowrap}.lineup-list div{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 7px;background:#fff;border-radius:7px}.lineup-list span{color:#64748b}@media(max-width:600px){main{padding:10px}.player button{padding:8px}.bar{align-items:flex-start}}</style></head><body><header><div class="brand">SALARY DUEL</div><div class="tag">Fantasy football. Your lineup. Their lineup. Same player pool.</div></header><main id="app"></main><script>const app=document.getElementById("app");
const S={id:localStorage.sd_id||"",code:localStorage.sd_code||"",week:Number(localStorage.sd_week||1),league:null,me:null,view:null,matchups:null,lineup:{QB:[],RB:[],WR:[],FLEX:[]}};
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const empty=()=>({QB:[],RB:[],WR:[],FLEX:[]});
const save=()=>{localStorage.sd_id=S.id;localStorage.sd_code=S.code;localStorage.sd_week=S.week};
async function api(path,opt={}){const headers={"Content-Type":"application/json"};if(S.code)headers["x-team-code"]=S.code;const r=await fetch(path,{...opt,headers,body:opt.body?JSON.stringify(opt.body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function home(msg=""){app.innerHTML=`<section class="card"><h1>Play Salary Duel</h1><p class="muted">Daily-fantasy style salary cap football played head-to-head.</p>${msg?'<p class="err">'+esc(msg)+'</p>':""}<h2>Create a league</h2><form id="create"><input name="name" placeholder="League name" required><div class="grid"><label>Season<input name="season" type="number" value="2026"></label><label>First NFL week<input name="startWeek" type="number" value="4"></label><label>Weeks<input name="numWeeks" type="number" value="8"></label><label>Salary cap<input name="budget" type="number" value="50000"></label></div><label>Team names — one per line<textarea name="teams" rows="5" placeholder="Brian\nMike\nJohn" required></textarea></label><select name="provider"><option value="sleeper">Real NFL data</option><option value="mock">Demo data</option></select><button>Create League</button></form><hr><h2>Join a league</h2><form id="join"><input name="id" placeholder="League ID" required><input name="code" placeholder="Your team access code" required><button>Join League</button></form></section>`;document.getElementById("create").onsubmit=create;document.getElementById("join").onsubmit=join}
async function create(e){e.preventDefault();try{const f=new FormData(e.target);const d=await api("/api/leagues",{method:"POST",body:{name:f.get("name"),season:+f.get("season"),startWeek:+f.get("startWeek"),numWeeks:+f.get("numWeeks"),budget:+f.get("budget"),provider:f.get("provider"),teams:String(f.get("teams")).split("\n").map(x=>x.trim()).filter(Boolean)}});S.id=d.league.id;S.code=d.codes[0].code;S.week=1;save();showCodes(d.codes)}catch(x){home(x.message)}}
async function join(e){e.preventDefault();try{const f=new FormData(e.target);S.id=String(f.get("id")).trim().toLowerCase();S.code=String(f.get("code")).trim().toUpperCase();S.week=1;save();await load()}catch(x){localStorage.removeItem("sd_id");localStorage.removeItem("sd_code");S.id="";S.code="";home(x.message)}}
function showCodes(codes){app.innerHTML=`<section class="card"><h2>League created</h2><p>Give each friend their own code. The league ID is shared by everyone.</p>${codes.map(c=>`<p><b>${esc(c.name)}</b>: <span class="copy">${esc(c.code)}</span></p>`).join("")}<button id="continue">Enter League</button></section>`;document.getElementById("continue").onclick=load}
async function load(){try{S.league=await api("/api/leagues/"+S.id);S.me=await api("/api/leagues/"+S.id+"/me");S.view=await api("/api/leagues/"+S.id+"/weeks/"+S.week);S.matchups=await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/matchups");S.lineup=S.view.matchup?.myLineup||empty();render()}catch(x){home(x.message)}}
async function renderLive(){const box=document.getElementById("liveContent");if(!box)return;box.innerHTML="<p class=\"muted\">Loading live scores…</p>";try{const d=await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/live");if(d.bye){box.innerHTML="<p class=\"muted\">You have a bye this week.</p>";return}const mm=d.matchups.find(x=>x.teams.some(t=>t.id===S.me?.team?.id));if(!mm){box.innerHTML="<p class=\"muted\">No matchup found.</p>";return}box.innerHTML=mm.teams.map(tm=>`<div class="score-team"><div class="bar"><div><b>${esc(tm.name)}</b><div class="muted">${tm.submitted?"Submitted":"Not submitted"}</div></div><div class="live-score">${tm.score===null?"—":Number(tm.score).toFixed(1)}</div></div>${tm.lineup?`<div>${Object.entries(tm.lineup).flatMap(([slot,ids])=>ids.map(pid=>{const p=(S.view.matchup?.pool||[]).find(x=>x.id===pid);return `<div class="score-player"><span>${esc(slot)} · ${esc(p?.name||pid)}</span><b>${Number(tm.playerPoints[pid]||0).toFixed(1)}</b></div>`})).join("")}</div>`:`<p class="muted">${d.week.status==="open"?"Opponent lineup is hidden until the week is locked.":"Lineup unavailable."}</p>`}</div>`).join("")+`<p class="muted">Updated ${new Date(d.refreshedAt).toLocaleTimeString()} · <button id="refreshLive" class="secondary">Refresh</button></p>`;document.getElementById("refreshLive").onclick=renderLive}catch(e){box.innerHTML="<p class=\"err\">"+esc(e.message)+"</p>"}}\nfunction matchupsCard(){const ms=S.matchups.matchups.filter(x=>!x.bye),complete=ms.filter(x=>x.teams.every(t=>t.submitted)).length;return `<section class="card" id="matchupsSection"><div class="bar"><div><h2>Week ${S.week} Matchups</h2><p class="muted">${complete}/${ms.length} matchups have both lineups submitted</p></div><span class="pill">${esc(S.matchups.week.status)}</span></div>${S.matchups.matchups.map(mm=>{if(mm.bye)return '<div class="matchup"><b>'+esc(mm.teams[0]?.name||"")+" — Bye</b></div>";const done=mm.teams.every(x=>x.submitted);const rows=mm.teams.map(tm=>{const lu=tm.lineup;return '<div class="match-team"><div class="bar"><b>'+esc(tm.name)+'</b><span class="'+(tm.submitted?"good":"err")+'">'+(tm.submitted?"✓ Submitted":"✗ Not submitted")+'</span></div>'+(lu?'<div class="lineup-list">'+Object.entries(lu).flatMap(([slot,ids])=>ids.map(id=>{const p=(mm.pool||[]).find(x=>x.id===id);return '<div><span>'+esc(slot)+'</span><b>'+esc(p?.name||id)+'</b></div>'})).join("")+'</div>':"")+'</div>'}).join('<div class="versus">VS</div>');return '<details class="matchup"'+(done&&["locked","final"].includes(S.matchups.week.status)?' open':"")+'><summary><b>'+esc(mm.teams[0].name)+'</b> vs <b>'+esc(mm.teams[1].name)+'</b><span class="muted"> · '+(done?"Both submitted":"Waiting for lineup")+'</span></summary>'+rows+'</details>'}).join("")}</section>`}function render(){const l=S.league,w=S.view,m=w.matchup;app.innerHTML=`<section class="card"><div class="bar"><div><h1>${esc(l.name)}</h1><span class="pill">Week ${S.week}</span><span class="pill">NFL ${w.week.nflWeek}</span><span class="pill">${esc(w.week.status)}</span></div><button class="secondary" id="leave">Switch League</button></div><p>League ID: <b class="copy">${esc(l.id)}</b> · Cap: <b>$${Number(l.budget).toLocaleString()}</b></p><div class="bar"><button id="prev" class="secondary">Previous</button><button id="next" class="secondary">Next</button></div></section><div class="tabbar"><button id="tabLineup">My Lineup</button><button id="tabLive">Live Scoring</button><button id="tabMatchups">Matchups</button><button id="tabStandings">Standings</button></div>${m?lineup(m,l):'<section class="card" id="lineupSection"><h2>Bye week</h2><p>You do not have a matchup this week.</p></section>'}${matchupsCard()}<section class="card" id="liveSection" style="display:none"><div class="bar"><div><h2>Live Scoring</h2><p class="muted">Current fantasy points from the NFL data feed.</p></div></div><div id="liveContent"><p class="muted">Tap Live Scoring to load.</p></div></section><section class="card" id="standingsSection" style="display:none"><h2>Standings</h2><table class="standings"><tr><th>Team</th><th>Record</th><th>PF</th></tr>${l.standings.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.w}-${r.l}-${r.t}</td><td>${r.pf}</td></tr>`).join("")}</table></section>`;document.getElementById("leave").onclick=()=>{localStorage.removeItem("sd_id");localStorage.removeItem("sd_code");location.reload()};document.getElementById("prev").onclick=()=>{if(S.week>1){S.week--;save();load()}};document.getElementById("next").onclick=()=>{if(S.week<l.numWeeks){S.week++;save();load()}};const showTab=id=>{["lineupSection","liveSection","matchupsSection","standingsSection"].forEach(x=>{const el=document.getElementById(x);if(el)el.style.display=x===id?"":"none"});if(id==="liveSection")renderLive()};document.getElementById("tabLineup").onclick=()=>showTab("lineupSection");document.getElementById("tabLive").onclick=()=>showTab("liveSection");document.getElementById("tabMatchups").onclick=()=>showTab("matchupsSection");document.getElementById("tabStandings").onclick=()=>showTab("standingsSection");showTab("lineupSection")}function salary(l){return Object.values(S.lineup).flat().reduce((sum,id)=>sum+(S.view.matchup.pool.find(p=>p.id===id)?.salary||0),0)}
function lineup(m,l){const pool=m.pool||[];const groups={QB:pool.filter(p=>p.pos==="QB"),RB:pool.filter(p=>p.pos==="RB"),WR:pool.filter(p=>p.pos==="WR"),TE:pool.filter(p=>p.pos==="TE")};const slots=[["QB","QB",1],["RB","RB",2],["WR","WR",3],["FLEX","FLEX",2]];const sal=salary(l);const complete= S.lineup.QB.length===1&&S.lineup.RB.length===2&&S.lineup.WR.length===3&&S.lineup.FLEX.length===2;return `<section class="card" id="lineupSection"><div class="bar"><div><h2>Your Lineup</h2><p class="muted">Click a player, then choose the slot. Players cannot be used twice.</p></div><div class="salary">$${sal.toLocaleString()} / $${Number(l.budget).toLocaleString()}</div></div><p class="${sal>l.budget?"err":"good"}">${complete?"8 / 8 players selected":"Select "+(8-(S.lineup.QB.length+S.lineup.RB.length+S.lineup.WR.length+S.lineup.FLEX.length)+" more players")}</p><div class="slots">${slots.map(([key,title,max])=>slot(key,title,max,pool)).join("")}</div><div class="card" style="margin-top:14px;background:#f8fafc"><h3>Available Players</h3><p class="muted">Add players below. FLEX accepts RB, WR or TE.</p>${groups.QB.map(p=>player(p)).join("")}${groups.RB.map(p=>player(p)).join("")}${groups.WR.map(p=>player(p)).join("")}${groups.TE.map(p=>player(p)).join("")}</div><div class="bar"><button id="saveLineup" type="button" ${!complete||sal>l.budget||wDisabled(m)?"disabled":""}>Save Lineup</button>${isCommish(l)?'<span><button id="openWeek" class="secondary">Open Week</button> <button id="lockWeek" class="secondary">Lock Week</button> <button id="scoreWeek" class="secondary">Score Week</button></span>':""}</div><p class="muted">Opponent: ${esc(m.opponent?.name||"Bye")} · Your opponent receives the exact same player pool and salaries.</p>${m.result?resultBox(m,l):""}</section>`}
function wDisabled(m){return !m||!m.pool?.length||["locked","final"].includes(S.view.week.status)}
function isCommish(l){return !!S.me?.team?.isCommish}
function slot(key,title,max,pool){return `<div class="slot"><h3>${title} <span class="muted">(${S.lineup[key].length}/${max})</span></h3>${S.lineup[key].map(id=>{const p=pool.find(x=>x.id===id);return p?`<div class="player selected"><span><b>${esc(p.name)}</b><small>${esc(p.pos)} · $${p.salary.toLocaleString()}</small></span><button class="remove" data-id="${esc(id)}" data-slot="${key}">Remove</button></div>`:""}).join("")||'<p class="muted">Empty</p>'}</div>`}
function player(p){const current=Object.entries(S.lineup).find(([k,ids])=>ids.includes(p.id));return `<div class="player ${current?"selected":""}"><span><b>${esc(p.name)}</b><small>${esc(p.pos)} · ${esc(p.team)} · ${p.proj} proj · $${p.salary.toLocaleString()}</small></span>${current?`<button class="remove" data-id="${esc(p.id)}" data-slot="${current[0]}">Remove</button>`:`<select class="assign" data-id="${esc(p.id)}"><option value="">Add to…</option>${p.pos==="QB"?'<option value="QB">QB</option>':""}${p.pos==="RB"?'<option value="RB">RB</option>':""}${p.pos==="WR"?'<option value="WR">WR</option>':""}${["RB","WR","TE"].includes(p.pos)?'<option value="FLEX">FLEX</option>':""}</select>`}</div>`}
function resultBox(m,l){const oid=m.opponent?.id;const mine=S.me?.team?.id;return '<div class="card"><h3>Final score</h3><p>Your score: <b>'+(m.result.points[mine]??"—")+'</b></p><p>Opponent: <b>'+(oid?m.result.points[oid]:"—")+'</b></p></div>'}
document.addEventListener("change",e=>{if(!e.target.classList.contains("assign"))return;const id=e.target.dataset.id,slot=e.target.value;if(!slot)return;const max={QB:1,RB:2,WR:3,FLEX:2}[slot];if(S.lineup[slot].length>=max){alert(slot+" is full");e.target.value="";return}if(Object.values(S.lineup).flat().includes(id)){e.target.value="";return}S.lineup[slot].push(id);render()});
document.addEventListener("click",async e=>{if(e.target.classList.contains("remove")){const id=e.target.dataset.id,slot=e.target.dataset.slot;S.lineup[slot]=S.lineup[slot].filter(x=>x!==id);render();return}try{if(e.target.id==="saveLineup"){const btn=e.target;btn.disabled=true;btn.textContent="Saving…";await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/lineup",{method:"PUT",body:{lineup:S.lineup}});btn.textContent="Saved ✓";await load()}else if(e.target.id==="openWeek"){await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/open",{method:"POST"});await load()}else if(e.target.id==="lockWeek"){await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/lock",{method:"POST"});await load()}else if(e.target.id==="scoreWeek"){await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/score",{method:"POST"});await load()}}catch(x){alert(x.message)}});
if(S.id&&S.code)load();else home();</script></body></html>
