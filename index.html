const S={id:localStorage.sd_id||"",code:localStorage.sd_code||"",week:Number(localStorage.sd_week||1),league:null,me:null,view:null,matchups:null,lineup:{QB:[],RB:[],WR:[],FLEX:[]}};
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const empty=()=>({QB:[],RB:[],WR:[],FLEX:[]});
const save=()=>{localStorage.sd_id=S.id;localStorage.sd_code=S.code;localStorage.sd_week=S.week};
async function api(path,opt={}){const headers={"Content-Type":"application/json"};if(S.code)headers["x-team-code"]=S.code;const r=await fetch(path,{...opt,headers,body:opt.body?JSON.stringify(opt.body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d}
function home(msg=""){app.innerHTML=`<section class="card"><div class="hero-brand">${cappedLogo}<div><h1>Play Capped</h1><p class="muted">Salary-cap fantasy football played head-to-head.</p></div></div>${msg?'<p class="err">'+esc(msg)+'</p>':""}<h2>Create a league</h2><form id="create"><input name="name" placeholder="League name" required><div class="grid"><label>Season<input name="season" type="number" value="2026"></label><label>First NFL week<input name="startWeek" type="number" value="4"></label><label>Weeks<input name="numWeeks" type="number" value="8"></label><label>Salary cap<input name="budget" type="number" value="50000"></label></div><label>Team names — one per line<textarea name="teams" rows="5" placeholder="Brian\nMike\nJohn" required></textarea></label><select name="provider"><option value="sleeper">Real NFL data</option><option value="mock">Demo data</option></select><button>Create League</button></form><hr><h2>Join a league</h2><form id="join"><input name="id" placeholder="League ID" required><input name="code" placeholder="Your team access code" required><button>Join League</button></form></section>`;document.getElementById("create").onsubmit=create;document.getElementById("join").onsubmit=join}
async function create(e){e.preventDefault();try{const f=new FormData(e.target);const d=await api("/api/leagues",{method:"POST",body:{name:f.get("name"),season:+f.get("season"),startWeek:+f.get("startWeek"),numWeeks:+f.get("numWeeks"),budget:+f.get("budget"),provider:f.get("provider"),teams:String(f.get("teams")).split("\n").map(x=>x.trim()).filter(Boolean)}});S.id=d.league.id;S.code=d.codes[0].code;S.week=1;save();showCodes(d.codes)}catch(x){home(x.message)}}
async function join(e){e.preventDefault();try{const f=new FormData(e.target);S.id=String(f.get("id")).trim().toLowerCase();S.code=String(f.get("code")).trim().toUpperCase();S.week=1;save();await load()}catch(x){localStorage.removeItem("sd_id");localStorage.removeItem("sd_code");S.id="";S.code="";home(x.message)}}
function showCodes(codes){app.innerHTML=`<section class="card"><h2>League created</h2><p>Give each friend their own code. The league ID is shared by everyone.</p>${codes.map(c=>`<p><b>${esc(c.name)}</b>: <span class="copy">${esc(c.code)}</span></p>`).join("")}<button id="continue">Enter League</button></section>`;document.getElementById("continue").onclick=load}
async function load(){try{S.league=await api("/api/leagues/"+S.id);S.me=await api("/api/leagues/"+S.id+"/me");S.view=await api("/api/leagues/"+S.id+"/weeks/"+S.week);S.matchups=await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/matchups");S.lineup=S.view.matchup?.myLineup||empty();render()}catch(x){home(x.message)}}
function matchupsCard(){const ms=S.matchups.matchups.filter(x=>!x.bye),complete=ms.filter(x=>x.teams.every(t=>t.submitted)).length;let out='<section class="card"><div class="bar"><div><h2>Week '+S.week+' Matchups</h2><p class="muted">'+complete+'/'+ms.length+' matchups have both lineups submitted</p></div><span class="pill">'+esc(S.matchups.week.status)+'</span></div>';S.matchups.matchups.forEach(mm=>{if(mm.bye){out+='<div class="matchup"><b>'+esc(mm.teams[0]?.name||'')+' — Bye</b></div>';return}const done=mm.teams.every(x=>x.submitted);out+='<details class="matchup"'+(done&&["locked","final"].includes(S.matchups.week.status)?' open':'')+'><summary><b>'+esc(mm.teams[0].name)+'</b> vs <b>'+esc(mm.teams[1].name)+'</b><span class="muted"> · '+(done?'Both submitted':'Waiting for lineup')+'</span></summary>';mm.teams.forEach(tm=>{out+='<div class="match-team"><div class="bar"><b>'+esc(tm.name)+'</b><span class="'+(tm.submitted?'good':'err')+'">'+(tm.submitted?'✓ Submitted':'✗ Not submitted')+'</span></div>';if(tm.lineup){out+='<div class="lineup-list">';Object.entries(tm.lineup).forEach(([slot,ids])=>ids.forEach(id=>{const p=(mm.pool||[]).find(x=>x.id===id);out+='<div><span>'+esc(slot)+'</span><b>'+esc(p?.name||id)+'</b></div>'}));out+='</div>'}out+='</div>'});out+='</details>'});return out+'</section>'}function commissionerCard(l){if(!isCommish(l))return "";const data=S.matchups||{matchups:[],week:{status:""}};const ms=data.matchups.filter(x=>!x.bye),submitted=ms.reduce((n,m)=>n+m.teams.filter(t=>t.submitted).length,0),total=ms.length*2,status=data.week.status;let out='<section class="card"><div class="bar"><div><h2>Commissioner Dashboard</h2><p class="muted">Manage Week '+S.week+' and see who is ready.</p></div><span class="pill">'+esc(status)+'</span></div><div class="grid"><div><b>'+submitted+' / '+total+'</b><small class="muted" style="display:block">Lineups submitted</small></div><div><b>'+ms.filter(m=>m.teams.every(t=>t.submitted)).length+' / '+ms.length+'</b><small class="muted" style="display:block">Matchups ready</small></div><div><b>'+l.teams.length+'</b><small class="muted" style="display:block">Teams</small></div></div><div class="bar" style="margin-top:14px"><span><b>Week controls</b><br><span class="muted">Open, lock, or score this week.</span></span><span><button id="dashOpen" class="secondary">Open Week</button> <button id="dashLock" class="secondary">Lock Week</button> <button id="dashScore" class="secondary">Score Week</button></span></div><div style="margin-top:14px">' ;ms.forEach(mm=>{out+='<div class="matchup"><div class="bar"><b>'+esc(mm.teams[0].name)+' vs '+esc(mm.teams[1].name)+'</b><span class="'+(mm.teams.every(t=>t.submitted)?'good':'err')+'">'+(mm.teams.every(t=>t.submitted)?'✓ Ready':'Waiting for lineup')+'</span></div><p class="muted" style="margin:6px 0 0">'+esc(mm.teams[0].name)+': '+(mm.teams[0].submitted?'Submitted':'Not submitted')+' · '+esc(mm.teams[1].name)+': '+(mm.teams[1].submitted?'Submitted':'Not submitted')+'</p></div>'});return out+'</div></section>'}function render(){const l=S.league,w=S.view,m=w.matchup;app.innerHTML=`<section class="card"><div class="bar"><div><h1>${esc(l.name)}</h1><span class="pill">Week ${S.week}</span><span class="pill">NFL ${w.week.nflWeek}</span><span class="pill">${esc(w.week.status)}</span></div><button class="secondary" id="leave">Switch League</button></div><p>League ID: <b class="copy">${esc(l.id)}</b> · Cap: <b>$${Number(l.budget).toLocaleString()}</b></p><div class="bar"><button id="prev" class="secondary">Previous</button><button id="next" class="secondary">Next</button></div></section>${commissionerCard(l)}${matchupsCard()}${m?lineup(m,l):'<section class="card"><h2>Bye week</h2><p>You do not have a matchup this week.</p></section>'}<section class="card"><h2>Standings</h2><table class="standings"><tr><th>Team</th><th>Record</th><th>PF</th></tr>${l.standings.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.w}-${r.l}-${r.t}</td><td>${r.pf}</td></tr>`).join("")}</table></section>`;document.getElementById("leave").onclick=()=>{localStorage.removeItem("sd_id");localStorage.removeItem("sd_code");location.reload()};document.getElementById("prev").onclick=()=>{if(S.week>1){S.week--;save();load()}};document.getElementById("next").onclick=()=>{if(S.week<l.numWeeks){S.week++;save();load()}}}
function salary(l){return Object.values(S.lineup).flat().reduce((sum,id)=>sum+(S.view.matchup.pool.find(p=>p.id===id)?.salary||0),0)}
function lineup(m,l){const pool=m.pool||[];const groups={QB:pool.filter(p=>p.pos==="QB"),RB:pool.filter(p=>p.pos==="RB"),WR:pool.filter(p=>p.pos==="WR"),TE:pool.filter(p=>p.pos==="TE")};const slots=[["QB","QB",1],["RB","RB",2],["WR","WR",3],["FLEX","FLEX",2]];const sal=salary(l);const complete= S.lineup.QB.length===1&&S.lineup.RB.length===2&&S.lineup.WR.length===3&&S.lineup.FLEX.length===2;return `<section class="card"><div class="bar"><div><h2>Your Lineup</h2><p class="muted">Click a player, then choose the slot. Players cannot be used twice.</p></div><div class="salary ${sal>l.budget?"over":""}">${sal.toLocaleString()} / ${Number(l.budget).toLocaleString()}</div></div>${sal>l.budget?`<div class="cap-warning"><div class="capd">CAP’D</div><div><b>You’re over the salary cap.</b><span>Drop ${(sal-l.budget).toLocaleString()} to submit your lineup.</span></div></div>`:`<p class="good">${complete?"8 / 8 players selected":"Select "+(8-(S.lineup.QB.length+S.lineup.RB.length+S.lineup.WR.length+S.lineup.FLEX.length)+" more players")}</p>`}<div class="slots">${slots.map(([key,title,max])=>slot(key,title,max,pool)).join("")}</div><div class="card" style="margin-top:14px;background:#f8fafc"><h3>Available Players</h3><p class="muted">Add players below. FLEX accepts RB, WR or TE.</p>${groups.QB.map(p=>player(p)).join("")}${groups.RB.map(p=>player(p)).join("")}${groups.WR.map(p=>player(p)).join("")}${groups.TE.map(p=>player(p)).join("")}</div><div class="bar"><button id="saveLineup" type="button" ${!complete||sal>l.budget||wDisabled(m)?"disabled":""}>Save Lineup</button>${isCommish(l)?'<span><button id="openWeek" class="secondary">Open Week</button> <button id="lockWeek" class="secondary">Lock Week</button> <button id="scoreWeek" class="secondary">Score Week</button></span>':""}</div><p class="muted">Opponent: ${esc(m.opponent?.name||"Bye")} · Your opponent receives the exact same player pool and salaries.</p>${m.result?resultBox(m,l):""}</section>`}
function wDisabled(m){return !m||!m.pool?.length||["locked","final"].includes(S.view.week.status)}
function isCommish(l){return !!S.me?.team?.isCommish}
function slot(key,title,max,pool){return `<div class="slot"><h3>${title} <span class="muted">(${S.lineup[key].length}/${max})</span></h3>${S.lineup[key].map(id=>{const p=pool.find(x=>x.id===id);return p?`<div class="player selected"><span><b>${esc(p.name)}</b><small>${esc(p.pos)} · $${p.salary.toLocaleString()}</small></span><button class="remove" data-id="${esc(id)}" data-slot="${key}">Remove</button></div>`:""}).join("")||'<p class="muted">Empty</p>'}</div>`}
function player(p){const current=Object.entries(S.lineup).find(([k,ids])=>ids.includes(p.id));return `<div class="player ${current?"selected":""}"><span><b>${esc(p.name)}</b><small>${esc(p.pos)} · ${esc(p.team)} · ${p.proj} proj · $${p.salary.toLocaleString()}</small></span>${current?`<button class="remove" data-id="${esc(p.id)}" data-slot="${current[0]}">Remove</button>`:`<select class="assign" data-id="${esc(p.id)}"><option value="">Add to…</option>${p.pos==="QB"?'<option value="QB">QB</option>':""}${p.pos==="RB"?'<option value="RB">RB</option>':""}${p.pos==="WR"?'<option value="WR">WR</option>':""}${["RB","WR","TE"].includes(p.pos)?'<option value="FLEX">FLEX</option>':""}</select>`}</div>`}
function resultBox(m,l){const oid=m.opponent?.id;const mine=S.me?.team?.id;return '<div class="card"><h3>Final score</h3><p>Your score: <b>'+(m.result.points[mine]??"—")+'</b></p><p>Opponent: <b>'+(oid?m.result.points[oid]:"—")+'</b></p></div>'}
document.addEventListener("change",e=>{if(!e.target.classList.contains("assign"))return;const id=e.target.dataset.id,slot=e.target.value;if(!slot)return;const max={QB:1,RB:2,WR:3,FLEX:2}[slot];if(S.lineup[slot].length>=max){alert(slot+" is full");e.target.value="";return}if(Object.values(S.lineup).flat().includes(id)){e.target.value="";return}S.lineup[slot].push(id);render()});
document.addEventListener("click",async e=>{if(e.target.classList.contains("remove")){const id=e.target.dataset.id,slot=e.target.dataset.slot;S.lineup[slot]=S.lineup[slot].filter(x=>x!==id);render();return}try{if(e.target.id==="saveLineup"){const btn=e.target;btn.disabled=true;btn.textContent="Saving…";await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/lineup",{method:"PUT",body:{lineup:S.lineup}});btn.textContent="Saved ✓";await load()}else if(e.target.id==="openWeek"||e.target.id==="dashOpen"){await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/open",{method:"POST"});await load()}else if(e.target.id==="lockWeek"||e.target.id==="dashLock"){await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/lock",{method:"POST"});await load()}else if(e.target.id==="scoreWeek"||e.target.id==="dashScore"){await api("/api/leagues/"+S.id+"/weeks/"+S.week+"/score",{method:"POST"});await load()}}catch(x){alert(x.message)}});
if(S.id&&S.code)load();else home();</script></body></html>
